# Build linux-enigmarsos-lts in an Arch Linux container.
#
# Weekly schedule: 04:00 UTC every Wednesday, plus manual dispatch.
# Each run first tries to advance the packaging (Arch linux-lts +
# BORE) and commits the result to `lts`, then compiles it.
# This file is identical on main and lts: it always checks out `lts`,
# because scheduled runs execute on the default branch.
name: Build linux-enigmarsos-lts

on:
  schedule:
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild even if this package version is already in the lts release'
        type: boolean
        default: true
      publish:
        description: 'Update the lts GitHub Release (false keeps workflow artifacts only)'
        type: boolean
        default: true
      kernel_version:
        description: 'Optional pin check (must match PKGBUILD pkgver, e.g. 6.18.51)'
        type: string
        required: false
        default: ''
      bore_version:
        description: 'Optional pin check (must match patches/bore.meta, e.g. 6.8.0)'
        type: string
        required: false
        default: ''

# Only one LTS compile per ref. A new run cancels an in-flight run.
concurrency:
  group: linux-enigmarsos-lts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  # Official Arch image, pinned by digest. Update with:
  #   docker pull archlinux:base-devel && docker inspect --format='{{index .RepoDigests 0}}' archlinux:base-devel
  ARCH_IMAGE: archlinux:base-devel@sha256:ee205c220399524a683cf495d411691b921baed8ab47cdc6d732efa782fae484
  ENABLE_CCACHE: '1'

jobs:
  update:
    name: Update LTS packaging from Arch
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lts
          fetch-depth: 0

      - name: Run Arch + BORE update scripts
        run: |
          set -euo pipefail
          ./scripts/update-arch-kernel.sh
          ./scripts/update-bore.sh
          ./scripts/status.sh || true

      - name: Commit and push if packaging changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "EnigmarsOS Kernel CI"
          git config user.email "ci@enigmarsos.org"
          git add PKGBUILD patches/bore.patch patches/bore.meta \
            config/config.x86_64 keys/pgp
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Packaging already current; nothing to commit."
          else
            git commit -m "auto: track Arch linux-lts $(awk -F= '/^pkgver=/{print $2; exit}' PKGBUILD)"
            # Fully qualified: a `lts` release *tag* also exists, so bare
            # `HEAD:lts` is ambiguous ("dst refspec matches more than one").
            git push origin HEAD:refs/heads/lts
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  decide:
    name: Decide whether to compile
    needs: update
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.decide.outputs.compile }}
      publish: ${{ steps.decide.outputs.publish }}
      trigger: ${{ steps.decide.outputs.trigger }}
      pkgver: ${{ steps.meta.outputs.pkgver }}
      pkgrel: ${{ steps.meta.outputs.pkgrel }}
      package_version: ${{ steps.meta.outputs.package_version }}
      bore_version: ${{ steps.meta.outputs.bore_version }}
      bore_commit: ${{ steps.meta.outputs.bore_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lts

      - name: Read packaging metadata
        id: meta
        run: |
          set -euo pipefail
          pkgver=$(awk -F= '/^pkgver=/{print $2; exit}' PKGBUILD)
          pkgrel=$(awk -F= '/^pkgrel=/{print $2; exit}' PKGBUILD)
          bore_version=$(awk -F= '/^BORE_VERSION=/{print $2; exit}' patches/bore.meta)
          bore_commit=$(awk -F= '/^BORE_COMMIT=/{print $2; exit}' patches/bore.meta)
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "package_version=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"
          echo "bore_version=$bore_version" >> "$GITHUB_OUTPUT"
          echo "bore_commit=$bore_commit" >> "$GITHUB_OUTPUT"
          echo "pkgver=$pkgver pkgrel=$pkgrel bore=$bore_version"

      - name: Honour manual version pins
        run: |
          set -euo pipefail
          req_k="${{ github.event.inputs.kernel_version }}"
          req_b="${{ github.event.inputs.bore_version }}"
          if [ -n "$req_k" ] && [ "$req_k" != "${{ steps.meta.outputs.pkgver }}" ]; then
            echo "Requested kernel_version=$req_k but PKGBUILD pkgver=${{ steps.meta.outputs.pkgver }}"
            echo "Update the lts branch with ./scripts/update-arch-kernel.sh first."
            exit 1
          fi
          if [ -n "$req_b" ] && [ "$req_b" != "${{ steps.meta.outputs.bore_version }}" ]; then
            echo "Requested bore_version=$req_b but pin is ${{ steps.meta.outputs.bore_version }}"
            echo "Update the lts branch with ./scripts/update-bore.sh first."
            exit 1
          fi

      - name: Decide compile / publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          force="${{ github.event.inputs.force_rebuild }}"
          publish_in="${{ github.event.inputs.publish }}"
          pkg_version="${{ steps.meta.outputs.package_version }}"
          # Moving tag: every LTS publish updates the same `lts` release.
          # Per-version skip checks below still use $asset names, so a new
          # kernel version always rebuilds while repeats are skipped.
          tag="lts"
          event="${{ github.event_name }}"
          changed="${{ needs.update.outputs.changed }}"

          trigger="$event"
          if [ "$event" = "workflow_dispatch" ]; then trigger=manual; fi
          if [ "$event" = "schedule" ]; then trigger=scheduled; fi
          publish=false
          compile=true
          asset="linux-enigmarsos-lts-${pkg_version}-x86_64.pkg.tar.zst"

          if [ "$event" = "schedule" ]; then
            publish=true
            if [ "$changed" != "true" ] && gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
              echo "No packaging updates and $asset already released; skipping compile."
              compile=false
              publish=false
            fi
          else
            if [ "$publish_in" = "true" ]; then publish=true; fi
            if [ "$force" = "" ]; then force=true; fi

            if [ "$force" != "true" ]; then
              if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
                echo "lts release already contains $asset and force_rebuild=false; skipping compile."
                compile=false
                publish=false
              fi
            fi
          fi

          echo "compile=$compile" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          echo "compile=$compile publish=$publish trigger=$trigger pkg=$pkg_version"

  build:
    name: Compile LTS kernel
    needs: decide
    if: needs.decide.outputs.compile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /usr/share/miniconda || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Add swap
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          ref: lts

      - name: Cache ccache
        if: env.ENABLE_CCACHE == '1'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-lts-${{ needs.decide.outputs.package_version }}-${{ needs.decide.outputs.bore_commit }}-${{ hashFiles('config/config.x86_64', 'config/enigmarsos.config', 'patches/bore.patch') }}
          restore-keys: |
            ccache-lts-${{ needs.decide.outputs.package_version }}-
            ccache-lts-
            ccache-

      - name: Pull pinned Arch image
        run: |
          set -euo pipefail
          docker pull "${ARCH_IMAGE}"
          docker image inspect "${ARCH_IMAGE}" --format '{{index .RepoDigests 0}}'

      - name: Build packages in Arch container
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp && github.event.repository.pushed_at || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          BUILD_TRIGGER: ${{ needs.decide.outputs.trigger }}
          ARCH_IMAGE_DIGEST: ${{ env.ARCH_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p out .ccache
          # SOURCE_DATE_EPOCH from the commit currently checked out.
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          kvm_args=()
          if [ -e /dev/kvm ]; then
            kvm_args=(-v /dev/kvm:/dev/kvm --device /dev/kvm)
          fi
          docker run --rm \
            --security-opt seccomp=unconfined \
            -e SOURCE_DATE_EPOCH \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_NUMBER \
            -e BUILD_TRIGGER \
            -e ARCH_IMAGE_DIGEST \
            -e ENABLE_CCACHE \
            -e CCACHE_DIR=/cache/ccache \
            -v "$PWD":/src:ro \
            -v "$PWD/out":/out \
            -v "$PWD/.ccache":/cache/ccache \
            "${kvm_args[@]}" \
            "${ARCH_IMAGE}" \
            /src/scripts/ci-build.sh

      - name: Confirm required artefacts
        run: |
          set -euo pipefail
          test -f out/BUILD-METADATA.txt
          test -f out/SHA256SUMS
          test -f out/RELEASE-NOTES.md
          ls -lh out/linux-enigmarsos-lts-*.pkg.tar.zst
          ls -lh out/linux-enigmarsos-lts-headers-*.pkg.tar.zst
          grep -q '^package_name=linux-enigmarsos-lts$' out/BUILD-METADATA.txt
          grep -q '^bore_version=' out/BUILD-METADATA.txt
          cat out/BUILD-METADATA.txt

      - name: Build GitHub-mirror pacman repo
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/src:ro \
            -v "$PWD/out":/out \
            "${ARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed pacman pacman-contrib
              command -v repo-add
              bash /src/scripts/publish-repo.sh /out /out
            '
          test -f out/linux-enigmarsos-lts.db
          test -f out/linux-enigmarsos-lts.db.tar.gz
          test ! -L out/linux-enigmarsos-lts.db
          ls -lh out/linux-enigmarsos-lts.db* out/linux-enigmarsos-lts.files* || true

      - name: Upload workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-enigmarsos-lts-${{ needs.decide.outputs.package_version }}
          path: |
            out/linux-enigmarsos-lts-*.pkg.tar.zst
            out/linux-enigmarsos-lts.db
            out/linux-enigmarsos-lts.db.tar.gz
            out/linux-enigmarsos-lts.files
            out/linux-enigmarsos-lts.files.tar.gz
            out/SHA256SUMS
            out/B2SUMS
            out/BUILD-METADATA.txt
            out/RELEASE-NOTES.md
            out/initramfs-linux-enigmarsos-lts.img
            out/namcap-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish lts GitHub Release (7 mirror files)
        if: needs.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="lts"
          title="linux-enigmarsos-lts ${{ needs.decide.outputs.package_version }} (BORE ${{ needs.decide.outputs.bore_version }})"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              out/linux-enigmarsos-lts-*.pkg.tar.zst \
              out/linux-enigmarsos-lts.db \
              out/linux-enigmarsos-lts.db.tar.gz \
              out/linux-enigmarsos-lts.files \
              out/linux-enigmarsos-lts.files.tar.gz \
              out/SHA256SUMS
            gh release edit "$tag" --latest=false --title "$title" --notes-file out/RELEASE-NOTES.md
            echo "Updated lts release"
          else
            gh release create "$tag" \
              --latest=false \
              --title "$title" \
              --notes-file out/RELEASE-NOTES.md \
              --target "$(git rev-parse HEAD)" \
              out/linux-enigmarsos-lts-*.pkg.tar.zst \
              out/linux-enigmarsos-lts.db \
              out/linux-enigmarsos-lts.db.tar.gz \
              out/linux-enigmarsos-lts.files \
              out/linux-enigmarsos-lts.files.tar.gz \
              out/SHA256SUMS
            echo "Created lts release"
          fi
          echo "Mirror: https://github.com/enigmars-project/linux-enigmarsos/releases/download/lts"
